[project]
name = "seudaily-core"
version = "1.0.0"
description = "Python automation and media runtime for the SEUdaily assistant"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dashscope>=1.25.15",
    "img2pdf>=0.6.3",
    "numpy>=2.4.3",
    "openai>=2.30.0",
    "opencv-python>=4.13.0.92",
    "playwright>=1.55.0",
    "faster-whisper>=1.2.1",
]

[project.scripts]
seudaily-tool = "cvstream.cli:main"
seudaily-worker = "cvstream.worker:main"
cvstream-tool = "cvstream.cli:main"
cvstream-worker = "cvstream.worker:main"

[project.urls]
Repository = "https://github.com/miunerofrade/SEUdaily"
Issues = "https://github.com/miunerofrade/SEUdaily/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvstream"]

[dependency-groups]
dev = ["pytest>=8.4.0"]
