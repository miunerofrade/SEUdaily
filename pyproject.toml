[project]
name = "seudaily-core"
version = "1.1.4"
description = "Python automation and media runtime for the SEUdaily assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dashscope>=1.25.15",
    "openai>=2.30.0",
    "httpx>=0.28.1",
    "cryptography>=46.0.6",
    "playwright==1.63.0",
    "tzdata>=2025.2",
    "openpyxl>=3.1.5",
    "pypdfium2>=5.13.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
ppt = [
    "img2pdf>=0.6.3",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
]
media = [
    "img2pdf>=0.6.3",
    "numpy>=2.4.3",
    "opencv-python>=4.13.0.92",
]

[project.scripts]
seudaily = "seudaily.launcher:main"
seudaily-tool = "seudaily.cli:main"
seudaily-worker = "seudaily.worker:main"
# Compatibility console-script aliases for users with existing invocations.
cvstream-tool = "seudaily.cli:main"
cvstream-worker = "seudaily.worker:main"

[project.urls]
Repository = "https://github.com/miunerofrade/SEUdaily"
Issues = "https://github.com/miunerofrade/SEUdaily/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seudaily", "src/cvstream"]

[dependency-groups]
dev = ["pytest>=8.4.0"]

[tool.pytest.ini_options]
# Interactive PTY scripts are run explicitly; dotted names are not pytest modules.
python_files = ["test_*.py"]
addopts = "--ignore-glob=*.local.py"
