name: npm release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version already committed in package.json
        required: true
        type: string
      publish:
        description: Publish to npm (requires npm environment approval and package ownership)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/distribution-ci.yml
  candidate:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.12.0'
          cache: npm
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.11.1'
      - run: npm ci
      - run: npm run build
      - run: npm run release:prepare -- "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-release-candidate
          path: build/release/packages/
          retention-days: 14
  publish:
    if: inputs.publish && github.ref == 'refs/heads/main'
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.12.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Ensure OIDC-capable npm
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-release-candidate
          path: build/release/packages/
      - name: Publish components, then the host
        run: npm run release:publish -- "$RELEASE_VERSION"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
